<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#140c08" />
    <title>数字大冒险 MaxGate</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud" class="hud hidden" aria-live="polite">
        <div class="hud-pill hud-left">
          <div class="lives" id="lives"></div>
          <div class="hud-subline">
            <span class="stage" id="stage">第 1 段</span>
            <span class="difficulty-badge" id="difficulty-badge">经典</span>
          </div>
        </div>
        <div class="hud-goal" aria-label="当前目标">选择更大的数</div>
        <div class="hud-pill hud-right" aria-label="积分">
          <div class="score" id="score">0</div>
        </div>
      </div>
      <div id="overlay" class="overlay">
        <section id="screen-menu" class="screen">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-leaf">✿</span>
            <span class="brand-number">9</span>
          </div>
          <h1>数字大冒险</h1>
          <p class="lead">
            选出<strong>更大的数</strong>，一路向前。
          </p>
          <fieldset class="difficulty-picker">
            <legend>选择节奏</legend>
            <div class="difficulty-options">
              <button type="button" class="difficulty-option" data-difficulty="cozy">
                <span>轻松</span><small>多一点时间</small>
              </button>
              <button type="button" class="difficulty-option selected" data-difficulty="classic">
                <span>经典</span><small>平衡推荐</small>
              </button>
              <button type="button" class="difficulty-option" data-difficulty="rush">
                <span>冲刺</span><small>快速计算</small>
              </button>
            </div>
          </fieldset>
          <button type="button" class="btn primary" id="btn-start">开始无限模式</button>
          <button type="button" class="btn ghost" id="btn-ranking">个人纪录</button>
          <p class="hint">← → / A D · 手机左右滑动</p>
        </section>
        <section id="screen-ranking" class="screen hidden">
          <p class="eyebrow">LOCAL CACHE</p>
          <h2>个人纪录</h2>
          <ol id="ranking-list" class="ranking-list"></ol>
          <p class="hint" id="ranking-empty">还没有纪录。先跑一局。</p>
          <button type="button" class="btn primary" id="btn-ranking-back">返回</button>
        </section>
        <section id="screen-over" class="screen hidden">
          <p class="eyebrow">RUN OVER</p>
          <h2>本局结束</h2>
          <p class="result" id="over-summary"></p>
          <p class="hint" id="over-rank-hint"></p>
          <button type="button" class="btn primary" id="btn-retry">再来一局</button>
          <button type="button" class="btn ghost" id="btn-over-ranking">查看纪录</button>
          <button type="button" class="btn ghost" id="btn-home">回主菜单</button>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
